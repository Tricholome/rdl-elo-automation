name: Update Rootelo HOOT

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Cache Pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run ELO calculation and generate HOOT site
        env:
          ROOTDB_TOKEN: ${{ secrets.ROOTDB_TOKEN }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          python main.py --league hoot

      - name: Prepare site structure
        run: |
          mkdir build_site
          # Déplacement du site HOOT sous /hoot/
          cp -r hoot build_site/
          # Copie des ressources globales et de l'API JSON
          cp -r static build_site/
          cp -r assets build_site/
          cp -r api build_site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build_site
          publish_branch: gh-pages
          keep_files: true
